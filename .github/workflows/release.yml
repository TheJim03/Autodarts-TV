name: Release

# Builds a signed release APK and attaches it to a GitHub Release
# whenever you push a tag like v1.0.0.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   KEYSTORE_BASE64    - the release keystore, base64-encoded
#   KEYSTORE_PASSWORD  - keystore password
#   KEY_ALIAS          - key alias (e.g. autodarts-tv)
#   KEY_PASSWORD       - key password

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Make gradlew executable
        run: chmod +x gradlew

      # NOTE: "Tools for Autodarts" is deliberately NOT built here, so released
      # APKs ship without it. Upstream's licensing is contradictory (LICENSE and
      # README say CC BY-NC 4.0, package.json says MIT) — see the "Tools for
      # Autodarts" section of README.md. Do not enable this without clearing
      # redistribution with creazy231 first.
      #
      # - uses: actions/setup-node@v4
      #   with: { node-version: "20" }
      # - run: corepack enable && node tools/tfa-build.mjs

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "autodarts-tv-${{ github.ref_name }}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: autodarts-tv-*.apk
          generate_release_notes: true
